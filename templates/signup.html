<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <title>Sign-up</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <img src="{{ url_for('static', filename='icon.png') }}" alt="Signup Image" style="width: 150px; height: 150px; border-radius: 50%;">
    <h1>Trendze</h1>


    <h1>Signup</h1>
    <form method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" style="font-size:1.5em;margin-top: 15px;" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" style="font-size:1.5em;margin-top: 15px;" required><br>
        <button type="submit" style="font-size:1.5em;margin-top: 15px;" >Signup</button>
    </form>
    <p>{{ get_flashed_messages()[0] if get_flashed_messages() else '' }}</p>
    <a href="{{ url_for('login_route') }}" style="font-size:1em;margin-top: 15px;" >Already have an account? Login here</a>
</body>
</html>
