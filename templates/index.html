<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendze App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
    <h1>Welcome to Trendze</h1>
    {% if 'username' in session %}
        <h1>Welcome, {{ session['username'] }}!</h1>
        <a href="{{ url_for('dashboard') }}" style="font-size: 1.5em;">Dashboard</a> | 
        <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
        <a href="{{ url_for('login_route') }}" style= "font-size: large";>Login</a> | 
        <a href="{{ url_for('signup_route') }}">Signup</a>
    {% endif %}
</body>
</html>
